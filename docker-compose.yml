version: '3.8'

services:
  # 1. FastAPI Intelligence Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HINDSIGHT_API_URL=http://hindsight:8888
      - PYTHONUNBUFFERED=1
    depends_on:
      - hindsight
    restart: unless-stopped

  # 2. React + Vite Frontend (Nginx SPA)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # 3. Vectorize Hindsight Semantic Memory Cluster
  hindsight:
    image: python:3.11-slim
    command: sh -c "pip install hindsight-api && python -m hindsight.server --port 8888"
    ports:
      - "8888:8888"
    environment:
      - HINDSIGHT_API_LLM_PROVIDER=groq
      - HINDSIGHT_API_LLM_API_KEY=${GROQ_API_KEY}
      - HINDSIGHT_API_LLM_MODEL=openai/gpt-oss-120b
    restart: unless-stopped
